syntax = "proto3";
import "common/proto/signature_info.proto";

package resdb.td_hotstuff;

message Certificate {
  SignatureInfo sign = 1;
  int32 view = 2;
  int32 signer = 3;
  bytes hash = 4;
  int32 slot = 6;
}

message Transaction{
  int32 id = 1;
  bytes data = 2;
  bytes hash = 3;
  int32 proxy_id = 4;
  int32 proposer = 5;
  uint64 timestamp = 6;
  int64 user_seq = 7;
  uint64 reception_time = 8;
}

enum ProposalType{
    NewMsg  = 0;
    Prepared = 1;
    Commit = 2;
    Ready_execute = 3;
}

message QC {
  repeated SignatureInfo signatures = 1;
  int32 view = 2;
  bytes hash = 3;
  int32 slot = 4;
  bytes signer_bitmap = 5;
  bytes available_signer_bitmap = 6;
  int32 collector_id = 7;
}

message TimeoutVote {
  int32 view = 1;
  int32 signer = 2;
  QC high_qc = 3;
  SignatureInfo signature = 4;
}

message TimeoutCert {
  int32 view = 1;
  QC high_qc = 2;
  bytes signer_bitmap = 3;
  repeated TimeoutVote votes = 4;
  string quorum_rule_id = 5;
}

message Header {
  int32 proposer_id = 1;
  int32 proposal_id = 2;
  int32 view = 3;
  QC qc = 4;
  bytes prehash = 5;
  int32 slot = 6;
  bytes leader_context_hash = 7;
  TimeoutCert timeout_cert = 8;
}

message Proposal {
  Header header = 1;
  repeated Transaction transactions = 2;
  int32 sender = 3;
  bytes hash = 4;
  uint64 createtime = 5;
  SignatureInfo signature = 6;
};

message CandidateValidatorWeight {
  int32 validator_id = 1;
  int64 next_weight = 2;
}

message CandidateLeaderWeight {
  int32 validator_id = 1;
  int64 leader_weight = 2;
}

message CandidateWeightUpdate {
  string protocol_id = 1;
  int64 old_weight_version = 2;
  string old_weight_root = 3;
  int32 activation_view = 4;
  int32 total_replicas = 5;
  uint64 window_index = 6;
  int32 start_qc_view = 7;
  int32 end_qc_view = 8;
  uint64 event_count = 9;
  string metric_root = 10;
  string next_weight_root = 11;
  string candidate_digest = 12;
  repeated CandidateValidatorWeight validators = 13;
  string leader_weight_root = 14;
  uint64 leader_params_version = 15;
  string leader_randomness_ref = 16;
  repeated CandidateLeaderWeight leader_validators = 17;
  string reputation_root = 18;
  string strong_fault_root = 19;
  string penalty_root = 20;
}

message WeightUpdateVote {
  string candidate_digest = 1;
  int32 validator_id = 2;
  string old_weight_root = 3;
  int64 old_weight_version = 4;
  int32 activation_view = 5;
  SignatureInfo signature = 6;
}

message WeightUpdateCert {
  CandidateWeightUpdate candidate_update = 1;
  bytes signer_bitmap = 2;
  repeated WeightUpdateVote votes = 3;
  string quorum_rule_id = 4;
}

enum MessageType {
  NewProposal = 0;
  Vote = 1;
  WeightUpdateCandidateMsg = 2;
  WeightUpdateVoteMsg = 3;
  WeightUpdateCertMsg = 4;
  TimeoutVoteMsg = 5;
  TimeoutCertMsg = 6;
};
